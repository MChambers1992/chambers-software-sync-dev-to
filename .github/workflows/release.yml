name: Semantic Release

# Runs after successful tests on main. Uses semantic-release to automatically
# bump the version based on commit messages ([Patch], [Minor], [Major]),
# update the plugin header, create a git tag, and build/attach the release zip.
#
# The trigger creates a new version tag (e.g., v1.0.1) which the existing
# deploy.yml will pick up and deploy to WP.org (when configured).

on:
  workflow_run:
    workflows: [ Tests ]
    branches: [ main ]
    types: [ completed ]

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release dependencies
        run: npm install --save-dev semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

name: Semantic Release

# Runs after successful tests on main. Uses semantic-release to automatically
# bump the version based on commit messages ([Patch], [Minor], [Major]),
# update the plugin header, create a git tag, and build/attach the release zip.
#
# The trigger creates a new version tag (e.g., v1.0.1) which the existing
# deploy.yml will pick up and deploy to WP.org (when configured).

on:
  push:
    branches: [ main ]

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Skip if this is a chore(release) commit (to avoid infinite loops)
    if: ${{ !contains(github.event.head_commit.message, 'chore(release)') }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify tags are fetched
        run: |
          git fetch --tags --force
          echo "Existing tags:"
          git tag -l || echo "(none)"
          echo "Current branch: $(git branch --show-current)"
          echo "HEAD commit: $(git log -1 --oneline)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install semantic-release dependencies
        run: npm install --save-dev semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec @semantic-release/github

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: semantic-release:*
        run: npx semantic-release --debug
